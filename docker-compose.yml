services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudcart-api

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloudcart
      DB_USER: cloudcart
      DB_PASSWORD: cloudcart_dev_password

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16

    container_name: cloudcart-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: cloudcart
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: cloudcart_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cloudcart -d cloudcart"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: